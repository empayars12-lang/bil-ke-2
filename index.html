<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Bill Realtime</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
    }
    input, select, button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #10b981;
    }
    button.danger {
      background: #ef4444;
    }
    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #eef4ff;
    }
    .logs {
      max-height: 260px;
      overflow: auto;
    }
    .muted {
      color: #6b7280;
      font-size: 13px;
    }
    #orderForm {
      display: block;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h2>Sistem Bill</h2>
      <div class="muted" id="statusText">Status: menunggu sambungan</div>
    </div>

    <div class="card">
      <h3>Buat Bill Baru</h3>
      <form id="orderForm">
        <div class="grid">
          <div class="field">
            <label>Nama Pelanggan</label>
            <input type="text" id="customerName" placeholder="Contoh: Ali" required />
          </div>

          <div class="field">
            <label>Tarikh Bill</label>
            <input type="date" id="orderDate" required />
          </div>

          <div class="field">
            <label>Staf</label>
            <select id="salesPerson" required></select>
          </div>

          <div class="field">
            <label>Jumlah Deposit</label>
            <input type="number" id="deposit" value="0" min="0" step="0.01" />
          </div>

          <div class="field">
            <label>Diskaun</label>
            <input type="number" id="discount" value="0" min="0" step="0.01" />
          </div>

          <div class="field">
            <label>Status</label>
            <select id="status">
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 20px;">
          <h4>Senarai Item</h4>
          <div id="itemsContainer"></div>
          <div style="margin-top: 12px;">
            <button type="button" class="secondary" id="addItemBtn">Tambah Item</button>
          </div>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 12px; align-items: center;">
          <button type="submit">Simpan Bill</button>
          <div class="muted" id="generatedInvoice">No bill: belum dijana</div>
        </div>
      </form>
    </div>

    <div class="card">
      <h3>Senarai Bill</h3>
      <table>
        <thead>
          <tr>
            <th>No Bill</th>
            <th>Pelanggan</th>
            <th>Tarikh</th>
            <th>Staf</th>
            <th>Total</th>
            <th>Status</th>
            <th>Tindakan</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Log Perubahan Bill</h3>
      <div class="logs" id="changeLogContainer"></div>
    </div>
  </div>

  <script>
    const supabaseUrl = "PASTE_SUPABASE_URL_HERE";
    const supabaseKey = "PASTE_SUPABASE_ANON_KEY_HERE";
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let orders = [];
    let salesPersons = [];
    let currentInvoiceNumber = "";

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("orderDate").valueAsDate = new Date();
      bindEvents();
      loadSalesPersons();
      loadOrders();
      loadChangeLogs();
      setupRealtime();
    });

    function bindEvents() {
      document.getElementById("orderForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        await createBill();
      });

      document.getElementById("addItemBtn").addEventListener("click", addItemRow);

      document.getElementById("discount").addEventListener("input", calculateValueFromItems);
      document.getElementById("deposit").addEventListener("input", calculateValueFromItems);
    }

    function addItemRow(item = { name: "", qty: 1, price: 0 }) {
      const container = document.getElementById("itemsContainer");

      const row = document.createElement("div");
      row.className = "grid";
      row.style.marginBottom = "12px";

      row.innerHTML = `
        <div class="field">
          <label>Nama Item</label>
          <input type="text" class="item-name" value="${item.name || ""}" placeholder="Contoh: Ayam Goreng" />
        </div>
        <div class="field">
          <label>Kuantiti</label>
          <input type="number" class="item-qty" value="${item.qty || 1}" min="1" step="1" />
        </div>
        <div class="field">
          <label>Harga</label>
          <input type="number" class="item-price" value="${item.price || 0}" min="0" step="0.01" />
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button type="button" class="danger remove-item-btn">Buang</button>
        </div>
      `;

      row.querySelector(".remove-item-btn").addEventListener("click", () => {
        row.remove();
        calculateValueFromItems();
      });

      row.querySelectorAll("input").forEach((input) => {
        input.addEventListener("input", calculateValueFromItems);
      });

      container.appendChild(row);
    }

    function getItemRows() {
      const rows = [...document.querySelectorAll("#itemsContainer > .grid")];
      const items = [];

      rows.forEach((row) => {
        const name = row.querySelector(".item-name").value.trim();
        const qty = Number(row.querySelector(".item-qty").value || 0);
        const price = Number(row.querySelector(".item-price").value || 0);

        if (name && qty > 0 && price >= 0) {
          items.push({
            name,
            qty,
            price,
            total: Number((qty * price).toFixed(2))
          });
        }
      });

      return items;
    }

    function calculateValueFromItems() {
      const items = getItemRows();
      const subtotal = items.reduce((sum, item) => sum + item.total, 0);
      const discount = Number(document.getElementById("discount").value || 0);
      const deposit = Number(document.getElementById("deposit").value || 0);

      const total = subtotal - discount;
      const balance = Math.max(total - deposit, 0);

      document.getElementById("generatedInvoice").innerText =
        "No bill: " + (currentInvoiceNumber || "belum dijana");
    }

    function generateInvoiceNumber() {
      const stamp = Date.now().toString().slice(-8);
      const random = Math.floor(Math.random() * 900 + 100);
      return `BILL-${stamp}-${random}`;
    }

    async function createBill() {
      const items = getItemRows();

      if (!items.length) {
        alert("Sila tambah sekurang-kurangnya satu item.");
        return;
      }

      const customerName = document.getElementById("customerName").value.trim();
      const orderDate = document.getElementById("orderDate").value;
      const salesPerson = document.getElementById("salesPerson").value;
      const discount = Number(document.getElementById("discount").value || 0);
      const deposit = Number(document.getElementById("deposit").value || 0);
      const status = document.getElementById("status").value;

      let invoiceNumber = generateInvoiceNumber();

      const subtotal = items.reduce((sum, item) => sum + (Number(item.qty) * Number(item.price)), 0);
      const totalAmount = subtotal - discount;
      const balance = Math.max(totalAmount - deposit, 0);

      const payload = {
        invoice_number: invoiceNumber,
        customer_name: customerName,
        order_date: orderDate,
        sales_person: salesPerson,
        items: items,
        subtotal: Number(subtotal.toFixed(2)),
        discount: Number(discount.toFixed(2)),
        total_amount: Number(totalAmount.toFixed(2)),
        deposit: Number(deposit.toFixed(2)),
        balance: Number(balance.toFixed(2)),
        status
      };

      const { data, error } = await supabase
        .from("orders")
        .insert([payload])
        .select()
        .single();

      if (error) {
        console.error(error);
        alert("Gagal simpan bill: " + error.message);
        return;
      }

      currentInvoiceNumber = data.invoice_number;
      document.getElementById("generatedInvoice").innerText = "No bill: " + currentInvoiceNumber;

      document.getElementById("orderForm").reset();
      document.getElementById("orderDate").valueAsDate = new Date();
      document.getElementById("itemsContainer").innerHTML = "";
      addItemRow();
      await loadOrders();
      showStatus("Bill berjaya disimpan");
    }

    async function loadSalesPersons() {
      const { data, error } = await supabase
        .from("sales_persons")
        .select("*")
        .order("name", { ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      salesPersons = data || [];
      const select = document.getElementById("salesPerson");
      select.innerHTML = "";

      salesPersons.forEach((person) => {
        const option = document.createElement("option");
        option.value = person.name;
        option.textContent = person.name;
        select.appendChild(option);
      });
    }

    async function loadOrders() {
      const { data, error } = await supabase
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      orders = data || [];
      renderOrders();
    }

    function renderOrders() {
      const tbody = document.getElementById("ordersTableBody");
      tbody.innerHTML = "";

      if (!orders.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="muted">Tiada bill lagi.</td>
          </tr>
        `;
        return;
      }

      orders.forEach((order) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${order.invoice_number}</td>
          <td>${order.customer_name || "-"}</td>
          <td>${order.order_date || "-"}</td>
          <td>${order.sales_person || "-"}</td>
          <td>RM ${Number(order.total_amount || 0).toFixed(2)}</td>
          <td>${order.status || "pending"}</td>
          <td>
            <div class="row-actions">
              <button type="button" class="secondary" data-edit="${order.id}">Edit</button>
            </div>
          </td>
        `;

        tr.querySelector("[data-edit]").addEventListener("click", () => openEditModal(order));
        tbody.appendChild(tr);
      });
    }

    function openEditModal(order) {
      const modalHtml = `
        <div id="editModal" style="
          position: fixed;
          inset: 0;
          background: rgba(17,24,39,0.5);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 1000;
        ">
          <div style="
            background: white;
            width: min(700px, 90vw);
            max-height: 90vh;
            overflow: auto;
            border-radius: 12px;
            padding: 24px;
          ">
            <h3>Edit Bill</h3>

            <div class="grid">
              <div class="field">
                <label>No Bill</label>
                <input type="text" id="editInvoiceNumber" value="${order.invoice_number}" readonly />
              </div>

              <div class="field">
                <label>Nama Pelanggan</label>
                <input type="text" id="editCustomerName" value="${order.customer_name || ""}" />
              </div>

              <div class="field">
                <label>Tarikh</label>
                <input type="date" id="editOrderDate" value="${order.order_date || ""}" />
              </div>

              <div class="field">
                <label>Staf</label>
                <select id="editSalesPerson"></select>
              </div>

              <div class="field">
                <label>Deposit</label>
                <input type="number" id="editDeposit" value="${order.deposit || 0}" step="0.01" />
              </div>

              <div class="field">
                <label>Diskaun</label>
                <input type="number" id="editDiscount" value="${order.discount || 0}" step="0.01" />
              </div>

              <div class="field">
                <label>Status</label>
                <select id="editStatus">
                  <option value="pending" ${order.status === "pending" ? "selected" : ""}>Pending</option>
                  <option value="completed" ${order.status === "completed" ? "selected" : ""}>Completed</option>
                </select>
              </div>
            </div>

            <div style="margin-top: 20px;">
              <h4>Item</h4>
              <div id="editItemsContainer"></div>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 12px;">
              <button type="button" id="saveEditBtn">Simpan Perubahan</button>
              <button type="button" class="danger" id="closeEditModalBtn">Tutup</button>
            </div>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML("beforeend", modalHtml);

      const editSalesPerson = document.getElementById("editSalesPerson");
      salesPersons.forEach((person) => {
        const option = document.createElement("option");
        option.value = person.name;
        option.textContent = person.name;
        if (person.name === order.sales_person) option.selected = true;
        editSalesPerson.appendChild(option);
      });

      const itemsContainer = document.getElementById("editItemsContainer");
      const orderItems = Array.isArray(order.items) ? order.items : [];

      if (orderItems.length) {
        orderItems.forEach((item) => addEditItemRow(item, itemsContainer));
      } else {
        addEditItemRow({ name: "", qty: 1, price: 0 }, itemsContainer);
      }

      document.getElementById("saveEditBtn").addEventListener("click", async () => {
        await saveEditedBill(order.id);
      });

      document.getElementById("closeEditModalBtn").addEventListener("click", () => {
        document.getElementById("editModal").remove();
      });
    }

    function addEditItemRow(item, container) {
      const row = document.createElement("div");
      row.className = "grid";
      row.style.marginBottom = "12px";

      row.innerHTML = `
        <div class="field">
          <label>Nama Item</label>
          <input type="text" class="edit-item-name" value="${item.name || ""}" />
        </div>
        <div class="field">
          <label>Kuantiti</label>
          <input type="number" class="edit-item-qty" value="${item.qty || 1}" min="1" />
        </div>
        <div class="field">
          <label>Harga</label>
          <input type="number" class="edit-item-price" value="${item.price || 0}" min="0" step="0.01" />
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button type="button" class="danger remove-edit-item-btn">Buang</button>
        </div>
      `;

      row.querySelector(".remove-edit-item-btn").addEventListener("click", () => row.remove());
      container.appendChild(row);
    }

    async function saveEditedBill(orderId) {
      const customerName = document.getElementById("editCustomerName").value.trim();
      const orderDate = document.getElementById("editOrderDate").value;
      const salesPerson = document.getElementById("editSalesPerson").value;
      const deposit = Number(document.getElementById("editDeposit").value || 0);
      const discount = Number(document.getElementById("editDiscount").value || 0);
      const status = document.getElementById("editStatus").value;

      const rows = [...document.querySelectorAll("#editItemsContainer > .grid")];
      const items = [];

      rows.forEach((row) => {
        const name = row.querySelector(".edit-item-name").value.trim();
        const qty = Number(row.querySelector(".edit-item-qty").value || 0);
        const price = Number(row.querySelector(".edit-item-price").value || 0);

        if (name && qty > 0 && price >= 0) {
          items.push({
            name,
            qty,
            price,
            total: Number((qty * price).toFixed(2))
          });
        }
      });

      if (!items.length) {
        alert("Sila pastikan sekurang-kurangnya satu item wujud.");
        return;
      }

      const subtotal = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
      const totalAmount = subtotal - discount;
      const balance = Math.max(totalAmount - deposit, 0);

      const updatePayload = {
        customer_name: customerName,
        order_date: orderDate,
        sales_person: salesPerson,
        items: items,
        subtotal: Number(subtotal.toFixed(2)),
        discount: Number(discount.toFixed(2)),
        total_amount: Number(totalAmount.toFixed(2)),
        deposit: Number(deposit.toFixed(2)),
        balance: Number(balance.toFixed(2)),
        status
      };

      const { data, error } = await supabase
        .from("orders")
        .update(updatePayload)
        .eq("id", orderId)
        .select();

      if (error) {
        console.error(error);
        alert("Gagal update bill: " + error.message);
        return;
      }

      document.getElementById("editModal").remove();
      await loadOrders();
      showStatus("Bill berjaya dikemaskini");
    }

    async function loadChangeLogs() {
      const { data, error } = await supabase
        .from("bill_change_logs")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      const container = document.getElementById("changeLogContainer");
      container.innerHTML = "";

      if (!data || !data.length) {
        container.innerHTML = "<div class='muted'>Tiada log perubahan setakat ini.</div>";
        return;
      }

      data.forEach((log) => {
        const box = document.createElement("div");
        box.style.border = "1px solid #e5e7eb";
        box.style.borderRadius = "8px";
        box.style.padding = "10px";
        box.style.marginBottom = "10px";

        box.innerHTML = `
          <div><strong>${log.invoice_number}</strong></div>
          <div class='muted'>Field: ${log.field}</div>
          <div>Old: ${log.old_value ?? "-"}</div>
          <div>New: ${log.new_value ?? "-"}</div>
          <div class='muted'>Tarikh: ${new Date(log.created_at).toLocaleString()}</div>
        `;

        container.appendChild(box);
      });
    }

    function showStatus(message) {
      document.getElementById("statusText").textContent = "Status: " + message;
    }

    function setupRealtime() {
      supabase
        .channel("orders_changes")
        .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => {
          loadOrders();
        })
        .subscribe();

      supabase
        .channel("bill_change_logs_changes")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "bill_change_logs" }, () => {
          loadChangeLogs();
        })
        .subscribe();
    }

    addItemRow();
  </script>
</body>
</html>
